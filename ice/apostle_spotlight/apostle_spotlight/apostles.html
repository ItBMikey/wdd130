<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background:#e8eced;
        }
        #wrapper {
            background-image: url("images/christus.webp");
            border: 5px solid black;
            width: 777px;
            height: 600px;
            margin: 0 auto;
            border-radius: 20px;
            background-size: cover;
            background-position-x: -175px;
            text-align: center;
        }
        .pres{
            width: 65px;
            height: 65px;
        }
        #cook{
            display: grid;
            grid-template-columns:repeat(4,1fr);
            
        }
        .firstp{
            width: 110px;
            height: 110px;
        }


    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div id="wrapper">
        <h1>First Presidency</h1>
        <img class="firstp" src="images/eyring.webp" alt="Henry B. Eyring">
        <img class="firstp" src="images/oaks.webp" alt="Dallin H. Oaks">
        <img class="firstp" src="images/christofferson.webp" alt="Christofferson">

        <h3>Qurem of the twelve Apostles</h3>
        <div id="cook">
            <img class= "pres" src="images/uchtdorf.webp" alt="Uchtdorf">
            <img class= "pres" src="images/bednar.webp" alt="Bednar">
            <img class= "pres" src="images/cook.webp" alt="Cook">
            <img class= "pres" src="images/anderson.webp" alt="Anderson">
            <img class= "pres" src="images/rasband.webp" alt="Rasband">
            <img class= "pres" src="images/stevenson.webp" alt="Stevenson">
            <img class= "pres" src="images/renlund.webp" alt="Renlund">
            <img class= "pres" src="images/gong.webp" alt="Gong">
            <img class= "pres" src="images/soares.webp" alt="Soares">
            <img class= "pres" src="images/kearon.webp" alt="Kearon">
            <img class= "pres" src="images/causse.webp" alt="Causse">
            <img class= "pres" src="images/gilbert.webp" alt="Gilbert">
        </div>

     </div>
</body>
</html>
